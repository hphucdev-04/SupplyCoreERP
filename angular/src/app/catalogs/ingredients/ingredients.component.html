<!-- #region Table -->
<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Ingredients' | abpLocalization }}
        </h5>
      </div>
      <div class="col col-md-6 text-end">
        <button class="btn btn-sm ph-btn-new" type="button" (click)="createIngredient()">
          <i class="fa fa-plus me-1"></i>
          <span>{{ '::NewIngredient' | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">

    <div class="row mb-3">
      <div class="col-md-12">
        <app-search [placeholder]="'::Search' | abpLocalization" [(value)]="filterText" [debounceTime]="800"
          (search)="onSearch($event)">
        </app-search>
      </div>
    </div>

    <ngx-datatable [rows]="ingredient.items" [count]="ingredient.totalCount" [list]="list" default>

      <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button class="btn btn-sm ph-btn-actions dropdown-toggle" data-toggle="dropdown" aria-haspopup="true"
              ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="editIngredient(row.id)">
                <i class="fa fa-edit me-1"></i>{{ '::Edit' | abpLocalization }}
              </button>
              <button ngbDropdownItem (click)="deleteIngredient(row.id)">
                <i class="fa fa-trash me-1"></i>{{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="code">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="ph-link">{{row.code}}</span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::CreationTime' | abpLocalization" prop="creationTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.creationTime | date: 'medium' }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
<!-- #endregion -->

<!-- #region Drawer -->
<app-drawer [isOpen]="isDrawerOpen" [title]="selectedIngredient.id ? '::EditIngredient' : '::NewIngredient'"
  [width]="'md'" [saveDisabled]="form.invalid" (close)="closeDrawer()" (save)="save()">

  <form [formGroup]="form" *ngIf="form">
    <div class="mb-3">
      <label for="unit-name" class="form-label small fw-semibold">
        {{ '::Name' | abpLocalization }} <span class="text-danger">*</span>
      </label>
      <input type="text" id="unit-name" class="form-control" formControlName="name" autofocus />
      <div class="invalid-feedback d-block" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        {{ '::ThisFieldIsRequired' | abpLocalization }}
      </div>
    </div>
  </form>
</app-drawer>
<!-- #endregion -->
