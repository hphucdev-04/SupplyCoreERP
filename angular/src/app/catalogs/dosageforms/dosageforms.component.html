<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:DosageForms' | abpLocalization }}
        </h5>
      </div>
      <div class="col col-md-6 text-end">
        <button class="btn btn-primary" type="button" (click)="createDosage()">
          <i class="fa fa-plus me-1"></i>
          <span>{{ '::NewDosage' | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">

   <div class="row mb-3">
      <div class="col-md-12">
        <app-search
          [placeholder]="'::Search' | abpLocalization"
          [(value)]="filterText"
          [debounceTime]= "800"
          (search)="onSearch($event)">
        </app-search>
      </div>
    </div>

    <ngx-datatable [rows]="dosage.items" [count]="dosage.totalCount" [list]="list" default>
      
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="editDosage(row.id)">
                <i class="fa fa-edit me-1"></i>{{ '::Edit' | abpLocalization }}
              </button>
              <button ngbDropdownItem (click)="deleteDosage(row.id)">
                <i class="fa fa-trash me-1"></i>{{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="code">
         <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.code }}
         </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>

      <ngx-datatable-column [name]="'::CreationTime' | abpLocalization" prop="creationTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.creationTime | date: 'medium' }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<app-drawer
  [isOpen]="isDrawerOpen"
  [title]="selectedDosage.id ? '::EditDosage' : '::NewDosage'"
  [width]="'md'"
  [saveDisabled]="form.invalid"
  (close)="closeDrawer()"
  (save)="save()">
  
  <form [formGroup]="form" *ngIf="form">
    
    <div class="mb-3">
      <label for="unit-name" class="form-label">
        {{ '::Name' | abpLocalization }} <span class="text-danger">*</span>
      </label>
      <input
        type="text"
        id="unit-name"
        class="form-control"
        formControlName="name"
        autofocus
      />
      <div class="invalid-feedback d-block" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        {{ '::ThisFieldIsRequired' | abpLocalization }}
      </div>
    </div>

    <div class="mb-3">
        <label for="unit-code" class="form-label">
          {{ '::Code' | abpLocalization }} <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          id="unit-code"
          class="form-control text-uppercase" 
          formControlName="code"
        />
        <div class="form-text text-muted" *ngIf="!selectedDosage.id">
            Mã được tự động gợi ý từ tên. Bạn có thể sửa lại.
        </div>
        <div class="invalid-feedback d-block" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
          {{ '::ThisFieldIsRequired' | abpLocalization }}
        </div>
      </div>

  </form>
</app-drawer>
