<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Categories' | abpLocalization }}
        </h5>
      </div>
      <div class="col col-md-6 text-end">
        <button
          class="btn btn-primary"
          type="button"
          (click)="createCategory()"
        >
          <i class="fa fa-plus me-1"></i>
          <span>{{ '::NewCategory' | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <ngx-datatable
      [rows]="category.items"
      [count]="category.totalCount"
      [list]="list"
      default
    >
    <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
    >
    <ng-template let-row="row" ngx-datatable-cell-template>
        <div ngbDropdown container="body">
            <button
                class="btn btn-primary btn-sm"
                type="button"
                ngbDropdownToggle
            >
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
        <div ngbDropdownMenu>
            <button ngbDropdownItem (click)="editCategory(row.id)">
                <i class="fa fa-edit me-1"></i>{{ '::Edit' | abpLocalization }}
            </button>
            <button ngbDropdownItem (click)="deleteCategory(row.id)">
                <i class="fa fa-trash me-1"></i>{{ '::Delete' | abpLocalization }}
            </button>
        </div>
        </div>
    </ng-template>
    </ngx-datatable-column>

      <ngx-datatable-column
        [name]="'::Name' | abpLocalization"
        prop="name"
        [width]="50"
      ></ngx-datatable-column>

      <ngx-datatable-column
        [name]="'::ProductCount' | abpLocalization"
        prop="productCount"
    
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge bg-info">{{ row.productCount }}</span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column
        [name]="'::CreationTime' | abpLocalization"
        prop="creationTime"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.creationTime | date: 'medium' }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<!-- Drawer for Create/Edit Category -->
<div class="drawer-overlay" *ngIf="isDrawerOpen" (click)="closeDrawer()"></div>
<div class="drawer" [class.drawer-open]="isDrawerOpen">
  <div class="drawer-header">
    <h5>
      {{
        selectedCategory.id
          ? ('::EditCategory' | abpLocalization)
          : ('::NewCategory' | abpLocalization)
      }}
    </h5>
    <button type="button" class="btn-close" (click)="closeDrawer()"></button>
  </div>

  <div class="drawer-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mb-3">
        <label for="category-name" class="form-label">
          {{ '::Name' | abpLocalization }}
          <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          id="category-name"
          class="form-control"
          formControlName="name"
          autofocus
        />
        <div
          class="invalid-feedback d-block"
          *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
        >
          {{ '::ThisFieldIsRequired' | abpLocalization }}
        </div>
      </div>
    </form>
  </div>

  <div class="drawer-footer">
    <button type="button" class="btn btn-secondary" (click)="closeDrawer()">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button
      type="button"
      class="btn btn-primary"
      (click)="save()"
      [disabled]="form.invalid"
    >
      {{ '::Save' | abpLocalization }}
    </button>
  </div>
</div>
