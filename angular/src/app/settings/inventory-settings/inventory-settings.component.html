<div class="settings-tab-container">
  <div class="settings-header">
    <div class="header-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17.01"/></svg>
    </div>
    <div class="header-text">
      <h2>{{ '::Settings:InventorySettings' | abpLocalization }}</h2>
      <p>{{ '::Settings:InventoryDescription' | abpLocalization }}</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <span>{{ '::Settings:Loading' | abpLocalization }}</span>
  </div>

  <div *ngIf="!isLoading" class="form-section">
    <div class="form-group">
      <label class="form-label" for="alert-days">Expiration Alert Days</label>
      <input 
        id="alert-days"
        type="number" 
        class="form-control" 
        [(ngModel)]="expirationAlertDays" 
        placeholder="Nhập số ngày (ví dụ: 30, 60...)"
        min="1"
      />
      <small class="ph-hint-msg">
        {{ '::Settings:InventoryAlertDaysHelp' | abpLocalization }}
      </small>
    </div>

    <div class="actions-section">
      <button 
        class="btn ph-btn-save" 
        (click)="saveSettings()">
        <span *ngIf="isSaving" class="btn-spinner"></span>
        {{ (isSaving ? '::Settings:Saving' : '::Settings:Save') | abpLocalization }}
      </button>
      <button 
        class="btn ph-btn-cancel" 
        (click)="resetSettings()">
        {{ (isResetting ? '::Settings:Restoring' : '::Settings:RestoreDefault') | abpLocalization }}
      </button>
    </div>
  </div>
</div>
