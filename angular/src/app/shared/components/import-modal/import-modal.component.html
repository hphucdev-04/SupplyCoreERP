<abp-modal [(visible)]="visible" [options]="{ size: 'md', centered: true }" (visibleChange)="close()">
  
  <ng-template #abpHeader>
    <h4 class="modal-title m-0">
        <i class="fa fa-file-import text-warning me-2"></i> {{ title | abpLocalization }}
    </h4>
  </ng-template>

  <ng-template #abpBody>
    <div class="mb-2" *ngIf="templateFn">
      <h6 class="fw-bold text-primary">{{ '::Step1_DownloadTemplate' | abpLocalization }}</h6>
      <div class="d-flex align-items-center p-2 bg-light text-white rounded border">
        <div class="flex-grow-1">
            <i class="fa fa-file-excel me-1"></i>
            <small>{{ templateName }}</small>
        </div>
        <button class="btn btn-primary btn-sm text-nowrap ms-3" (click)="downloadTemplate()">
            <i class="fa fa-download me-1"></i> {{ '::DownloadTemplate' | abpLocalization }}
        </button>
      </div>
    </div>

    <div class="mb-2">
      <h6 class="fw-bold text-primary">{{ '::Step2_UploadFile' | abpLocalization }}</h6>
      
      <div class="upload-area p-4 text-center rounded-3 position-relative"
           [class.bg-primary-subtle]="dragOver"
           [class.border-primary]="dragOver"
           (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave($event)"
           (drop)="onDrop($event)"
           style="border: 2px dashed #dee2e6; transition: all 0.2s; cursor: pointer;"
           (click)="fileInput.click()">
        
        <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept=".xlsx, .xls">

        <div *ngIf="!file">
            <i class="fa fa-cloud-upload-alt fa-3x text-muted mb-2"></i>
            <h6 class="mb-1">{{ '::DragAndDropHere' | abpLocalization }}</h6>
            <small class="text-muted">{{ '::OrClickToBrowse' | abpLocalization }}</small>
        </div>

        <div *ngIf="file">
            <i class="fa fa-file-excel fa-3x text-success mb-2"></i>
            <h6 class="fw-bold text-dark mb-1">{{ file.name }}</h6>
            <small class="text-muted d-block mb-3">{{ (file.size / 1024) | number:'1.0-2' }} KB</small>
            
            <button class="btn btn-sm btn-outline-danger" (click)="$event.stopPropagation(); file = null">
                <i class="fa fa-times me-1"></i> {{ '::Remove' | abpLocalization }}
            </button>
        </div>

      </div>
    </div>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-danger" (click)="close()">
        {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="button" class="btn btn-success text-white" (click)="upload()" [disabled]="!file || isImporting">
        <i class="fa" [ngClass]="isImporting ? 'fa-spinner fa-spin' : 'fa-check'"></i>
        {{ '::UploadAndImport' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
