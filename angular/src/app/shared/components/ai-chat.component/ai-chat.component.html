<div class="ai-chat-wrapper">
  <!-- 1. Danh sách lịch sử tin nhắn cuộn -->
  <div class="chat-messages" #scrollContainer>
    <div *ngFor="let msg of messages" class="message-row" [class.message-row--user]="msg.role === 'user'">
      <div class="message-bubble" [innerHTML]="renderMarkdown(msg.text)"></div>
    </div>
    
    <!-- Hiển thị hiệu ứng loading (AI đang gõ) -->
    <div *ngIf="isLoading" class="message-row">
      <div class="message-bubble typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- 2. Vùng chân trang chứa Panel trượt và Ô nhập chat -->
  <div class="chat-footer">
    
    <!-- 2.1 Inline Slide-up Panel (Kiểu Claude) -->
    <div class="slide-panel" [class.slide-panel--active]="pendingApprovalInfo || pendingElicitationInfo">
      
      <!-- Giao diện Approval trượt lên tối giản -->
      <div *ngIf="pendingApprovalInfo" class="panel-content">
        <div class="panel-header">
          <!-- Icon Alert cảnh báo -->
          <svg class="panel-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <h6>Yêu cầu xác nhận phê duyệt</h6>
        </div>
        <div class="panel-body">
          <p>Hệ thống cần xác nhận từ bạn để thực thi tác vụ ghi dữ liệu này.</p>
        </div>
        <div class="panel-actions">
          <button type="button" class="btn btn-flat-reject" (click)="onReject()" [disabled]="isExecutingTask">
            Từ chối
          </button>
          <button type="button" class="btn btn-flat-approve" (click)="onApprove()" [disabled]="isExecutingTask">
            Đồng ý
          </button>
        </div>
      </div>

      <!-- Giao diện Elicitation Form trượt lên -->
      <div *ngIf="pendingElicitationInfo" class="panel-content">
        <div class="panel-header info">
          <!-- Icon Form thông tin -->
          <svg class="panel-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <h6>{{ pendingElicitationInfo.elicitationForm.title }}</h6>
        </div>
        <div class="panel-body">
          <p class="desc">{{ pendingElicitationInfo.elicitationForm.description }}</p>
          <div *ngFor="let field of pendingElicitationInfo.elicitationForm.fields" class="form-field">
            <label [for]="field.name">
              {{ field.label }} <span *ngIf="field.required" style="color: #ef4444;">*</span>
            </label>
            <input 
              [type]="field.secret ? 'password' : 'text'" 
              [id]="field.name" 
              [(ngModel)]="elicitationFormValues[field.name]"
              [placeholder]="field.placeholder || ''"
              [disabled]="isExecutingTask"
            />
          </div>
        </div>
        <div class="panel-actions">
          <button type="button" class="btn btn-flat-reject" (click)="onCancelElicitation()" [disabled]="isExecutingTask">
            Hủy bỏ
          </button>
          <button type="button" class="btn btn-flat-submit" (click)="onSubmitElicitation()" [disabled]="isExecutingTask">
            Xác nhận
          </button>
        </div>
      </div>

    </div>

    <!-- 2.2 Ô nhập chat chính (Input Box) -->
    <div class="input-container" [class.input-container--disabled]="pendingApprovalInfo || pendingElicitationInfo">
      <textarea 
        [(ngModel)]="userInput" 
        (keydown.enter)="handleEnterKey($event)"
        [disabled]="pendingApprovalInfo || pendingElicitationInfo"
        placeholder="Nhập tin nhắn chat tại đây...">
      </textarea>
      
      <!-- Nút gửi tin nhắn (Chỉ hiện khi không có tác vụ pending) -->
      <button 
        *ngIf="!(pendingApprovalInfo || pendingElicitationInfo)" 
        (click)="sendChatMessage()" 
        [disabled]="!userInput.trim() || isLoading" 
        class="btn-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>

  </div>
</div>
