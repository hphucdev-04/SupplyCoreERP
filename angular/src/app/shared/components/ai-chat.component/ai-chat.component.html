<div class="ai-widget-container"
    style="position: fixed; bottom: 25px; right: 25px; z-index: 1000; font-family: sans-serif;">

    <!-- Chat window dùng Angular animation thay vì CSS class -->
    <div *ngIf="isOpen" @chatAnimation class="chat-window" style="margin-bottom: 15px; position: relative;">
        <deep-chat #chatElement [request]="chatRequest" [history]="chatInitialMessages" [markdown]="true" placeholder="Nhập câu hỏi tại đây..." [style]="{
        'width': '380px',
        'height': '550px',
        'border-radius': '16px',
        'box-shadow': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
        'border': '1px solid #e2e8f0',
        'background-color': '#ffffff'
      }" [messageStyles]="{
        'default': {
          'ai': { 'bubble': { 'background-color': '#f1f5f9', 'color': '#1e293b' } },
          'user': { 'bubble': { 'background-color': '#0284c7', 'color': '#ffffff' } }
        }
      }" [inputAreaStyle]="{
        'background-color': '#f8fafc',
        'border-top': '1px solid #e2e8f0',
        'border-bottom-left-radius': '16px',
        'border-bottom-right-radius': '16px'
      }" [file]="{ 'images': true }">
        </deep-chat>

        <!-- Overlay phê duyệt tác vụ nhạy cảm (Human-in-the-loop) -->
        <div *ngIf="pendingApprovalInfo" class="approval-overlay">
            <div class="approval-card" *ngIf="!isExecutingApproval">
                <div class="approval-header">
                    <svg class="approval-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <h4>Yêu cầu phê duyệt tác vụ</h4>
                </div>
                <div class="approval-body">
                    <p>Trợ lý AI đang yêu cầu thực thi một tác vụ hệ thống nhạy cảm:</p>
                    <div class="tool-info">
                        <strong>Tên tác vụ:</strong> <code>{{ pendingApprovalInfo.toolName }}</code>
                    </div>
                    <div class="tool-args" *ngIf="pendingApprovalInfo.arguments">
                        <strong>Tham số đi kèm:</strong>
                        <pre>{{ pendingApprovalInfo.arguments | json }}</pre>
                    </div>
                </div>
                <div class="approval-actions">
                    <button class="btn-reject" (click)="onReject()">Từ chối</button>
                    <button class="btn-approve" (click)="onApprove()">Đồng ý</button>
                </div>
            </div>

            <!-- Trạng thái đang gọi API Approve/Reject -->
            <div class="approval-card executing-state" *ngIf="isExecutingApproval">
                <div class="spinner"></div>
                <span>Đang thực thi tác vụ trên hệ thống...</span>
            </div>
        </div>
    </div>

    <!-- Nút bấm: pill chứa icon + chữ -->
    <button (click)="toggleChat()" class="toggle-button" (mouseenter)="onMouseEnter($event)"
        (mouseleave)="onMouseLeave($event)">

        <!-- Icon chat khi đóng -->
        <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor" class="icon">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
        </svg>

        <!-- Icon đóng khi mở -->
        <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor" class="icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>

        <span class="button-text">Trợ lý AI</span>
    </button>
</div>
