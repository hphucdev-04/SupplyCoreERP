<div class="ai-widget-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 9999; font-family: sans-serif;">
  
  <div *ngIf="isOpen" class="chat-window animate-fade-in" style="margin-bottom: 15px;">
    <deep-chat
      [demo]="true"
      [initialMessages]="chatInitialMessages"
      placeholder="Nhập câu hỏi tại đây..."
      [style]="{
        'width': '380px',
        'height': '550px',
        'border-radius': '16px',
        'box-shadow': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
        'border': '1px solid #e2e8f0',
        'background-color': '#ffffff'
      }"
      [messageStyles]="{
        'default': {
          'ai': { 'bubble': { 'background-color': '#f1f5f9', 'color': '#1e293b' } },
          'user': { 'bubble': { 'background-color': '#0284c7', 'color': '#ffffff' } }
        }
      }"
      [inputAreaStyle]="{
        'background-color': '#f8fafc',
        'border-top': '1px solid #e2e8f0',
        'border-bottom-left-radius': '16px',
        'border-bottom-right-radius': '16px'
      }"
      [file]="{ 'images': true }">
    </deep-chat>
  </div>

  <button 
    (click)="toggleChat()" 
    style="
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: white; 
      border: none; 
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease-in-out;
      margin-left: auto;
    "
    onmouseover="this.style.transform='scale(1.05)'"
    onmouseout="this.style.transform='scale(1)'">
    
    <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 28px; height: 28px;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
    </svg>
    <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 28px; height: 28px;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>

</div>
