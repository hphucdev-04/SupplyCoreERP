version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supplycore-db
    environment:
      POSTGRES_DB: SupplyCore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SupplyCore"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: supplycore-migrator
    build:
      context: .
      dockerfile: Dockerfile.dbmigrator
    container_name: supplycore-migrator
    environment:
      ConnectionStrings__Default: "Host=db;Database=SupplyCore;Username=postgres;Password=postgres;Port=5432;"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: supplycore-backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplycore-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=db;Database=SupplyCore;Username=postgres;Password=postgres;Port=5432;"
      App__SelfUrl: "http://localhost:8080"
      App__AngularUrl: "http://localhost:4200"
      App__CorsOrigins: "http://localhost:4200"
      App__RedirectAllowedUrls: "http://localhost:4200"
      AuthServer__Authority: "http://localhost:8080"
      AuthServer__RequireHttpsMetadata: "false"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    image: supplycore-frontend
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: supplycore-frontend
    ports:
      - "4200:80"
    volumes:
      - ./angular/dynamic-env.docker.json:/usr/share/nginx/html/dynamic-env.json
    depends_on:
      - backend

  mcp-server:
    image: supplycore-mcp-server
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: supplycore-mcp-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/SupplyCore"
      PORT: 3000
      NODE_ENV: development
      ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
